<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Will it explode today?</title>
    
    <style>

        exploded {

    background-image: url(explosion.png);

}

#center {

    position: absolute;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);

}

#explosionInformation {

    margin-top: 100px;

}

button {

    display: block;
    margin: 0 auto; 
    margin-top: 20px;

}

h1, h2{

    text-align: center;

}

#explosionCounter {

    color: red;

}

#defuseCounter {

    color: greenyellow;

}

button:disabled {

    opacity: 0.3;

}

    </style>

</head>
<body>

    <div>
    
        <h2>Bomb is active from 08:30-11:45 every day. </h1>
        <h2>Will it explode today or will they have time to defuse it?</h1>

    </div>

    <div id="center">

    <div>

    <h1>Time until bomb explodes</h1>
    <h1 id="timeLeft"></h1>

    <button id="extendButton">Extend timer</button>
    <button id="reduceButton">Decrease timer</button>

    </div>

    <div id="explosionInformation">

    <h2>Explosion counter: </h2>
    <h2 id="explosionCounter"></h2>

    </div>

    </div>

    <script>


function fetchStats() {
fetch('/api/stats')
.then((response) => response.json())
.then((result) => {

    const timeLeft = document.getElementById('timeLeft');

    const minutes = Math.floor(result.timeLeft / 60);
    const seconds = Math.floor(result.timeLeft % 60).toString().padStart(2, '0');

    const formattedTime = `${minutes}:${seconds}`
    timeLeft.textContent = formattedTime;

    const explosionCounter = document.getElementById('explosionCounter');
    explosionCounter.textContent = result.explosionCounter;

    const extendButton = document.getElementById('extendButton');
    const reduceButton = document.getElementById('reduceButton');

    extendButton.disabled = result.timerActive;
    reduceButton.disabled = result.timerActive;

});
}

fetchStats();

setInterval(fetchStats, 1000);

function extendTimer() {    

fetch('/api/extend-timer', {method: 'POST'})
.then((response) => response.json())
.then((result) => {

    const timeLeft = document.getElementById('timeLeft');

    const minutes = Math.floor(result.timeLeft / 60);
    const seconds = Math.floor(result.timeLeft % 60).toString().padStart(2, '0');

    const formattedTime = `${minutes}:${seconds}`
    timeLeft.textContent = formattedTime;

});
}

document.getElementById("extendButton").addEventListener("click", extendTimer);

function reduceTimer() {    

fetch('/api/reduce-timer', {method: 'POST'})
.then((response) => response.json())
.then((result) => {

    const timeLeft = document.getElementById('timeLeft');

    const minutes = Math.floor(result.timeLeft / 60);
    const seconds = Math.floor(result.timeLeft % 60).toString().padStart(2, '0');

    const formattedTime = `${minutes}:${seconds}`
    timeLeft.textContent = formattedTime;

});
}

document.getElementById("reduceButton").addEventListener("click", reduceTimer);

fetch('/api/explosion-counter')
.then((response) => response.json())
.then((result) => {

    const timeLeft = document.getElementById('explosionCounter');

    timeLeft.textContent = result.explosionCounter;

});

    </script>
    
</body>
</html>
